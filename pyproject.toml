[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tweetinsights"
version = "0.1.0"
description = "Offline social-topic trend analysis with a shareable HTML report"
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}
dependencies = []

[project.scripts]
tweetinsights = "tweetinsights.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
