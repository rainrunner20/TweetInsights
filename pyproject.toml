[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tweetinsights"
version = "0.1.0"
description = "Replayable offline-first post trend analytics"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
tweetinsights = "tweetinsights.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
